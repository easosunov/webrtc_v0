    </script>

    <!-- ==================== PUSH SUBSCRIPTION BUTTON ==================== -->
    <div id="push-sub-box" style="position: fixed; bottom: 240px; left: 10px; right: 10px; background: #4CAF50; padding: 15px; border-radius: 10px; text-align: center; z-index: 99999;">
        <button id="create-push-sub-btn" style="background: white; color: #4CAF50; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; width: 100%; cursor: pointer;">
            📢 CREATE PUSH SUBSCRIPTION
        </button>
        <div id="push-sub-status" style="color: white; margin-top: 8px; font-size: 12px;"></div>
    </div>

    <script>
        (function() {
            const btn = document.getElementById('create-push-sub-btn');
            const statusDiv = document.getElementById('push-sub-status');
            
            if (!btn) {
                console.log('Push subscription button not found');
                return;
            }
            
            btn.onclick = async function() {
                btn.disabled = true;
                btn.textContent = 'Creating...';
                statusDiv.innerHTML = 'Checking service worker...';
                
                try {
                    if (!('serviceWorker' in navigator)) {
                        throw new Error('Service Worker not supported');
                    }
                    
                    const registration = await navigator.serviceWorker.ready;
                    statusDiv.innerHTML = 'Service worker ready, checking existing subscription...';
                    
                    let subscription = await registration.pushManager.getSubscription();
                    
                    if (subscription) {
                        statusDiv.innerHTML = '✅ Push subscription already exists!';
                        statusDiv.style.color = '#90EE90';
                        btn.textContent = '✅ ALREADY REGISTERED';
                        return;
                    }
                    
                    statusDiv.innerHTML = 'No subscription found, creating one...';
                    
                    const vapidKey = 'BH33WjtMVo0Y_bml_nke0gtVqahGcPd6m-yjh__LBHp6Ahvfq-vN-m25D2MzMB3e1jbTGwQRGt5ufKEhSyj6Yv0';
                    const base64 = vapidKey.replace(/-/g, '+').replace(/_/g, '/');
                    const applicationServerKey = new Uint8Array(atob(base64).split('').map(c => c.charCodeAt(0)));
                    
                    subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: applicationServerKey
                    });
                    
                    statusDiv.innerHTML = '✅ Push subscription created successfully!';
                    statusDiv.style.color = '#90EE90';
                    btn.textContent = '✅ SUBSCRIBED';
                    
                    if (CONFIG && CONFIG.myUsername) {
                        statusDiv.innerHTML = 'Saving to Firestore...';
                        await db.collection('users').doc(CONFIG.myUsername).update({
                            webPushSubscription: subscription
                        });
                        statusDiv.innerHTML = '✅ Push subscription saved to your account!';
                    }
                    
                    setTimeout(() => {
                        location.reload();
                    }, 2000);
                    
                } catch (err) {
                    console.error('Error:', err);
                    statusDiv.innerHTML = '❌ Error: ' + err.message;
                    statusDiv.style.color = '#ff9999';
                    btn.disabled = false;
                    btn.textContent = '📢 TRY AGAIN';
                }
            };
        })();
    </script>
    <!-- ==================== END PUSH SUBSCRIPTION BUTTON ==================== -->
  
</body>
</html>
